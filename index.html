<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de Tablas de Multiplicar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="multiplicar.css" />
</head>

<body>

    <!-- Fondo animado con grid tech -->
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <main class="card">
        <header class="titulo">
            <div class="badge">
                <span class="dot"></span>
                <span>MATH.ENGINE v1.0</span>
            </div>
            <h2>TABLA DE<span class="accent">:</span></h2>
            <div class="input-group">
                <input type="text" id="txtTabla" placeholder="Escribe un número..." autocomplete="off" />
                <button onclick="generarTablas()">
                    <span>Probando Tableishons</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M13 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        </header>

        <section class="contenedor" id="contenedor">
            <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="18" height="18" rx="2" />
                    <path d="M9 9h6v6H9z" />
                </svg>
                <p>Ingresa un número para generar tu tabla</p>
            </div>
        </section>
    </main>

    <p class="footer">
        <span class="footer-line"></span>
        Autor: <strong>Edwin Arellano :D</strong>
        <span class="footer-line"></span>
    </p>

    <script src="multiplicar.js"></script>
</body>

</html>
